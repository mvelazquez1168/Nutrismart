services:
  db:
    image: postgres:16
    container_name: nutrismart-db
    environment:
      POSTGRES_USER: nutrismart
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: nutrismart
    ports:
      # 5434 en el host: el 5432 y el 5433 los ocupan los servicios nativos
      # de Windows (postgresql-x64-13 y postgresql-x64-18) y el Postgres de
      # Vetline. Publicar en un puerto ya ocupado NO da error en Docker: el
      # servicio nativo gana las conexiones y falla la autenticación.
      - "5434:5432"
    volumes:
      - nutrismart_pgdata:/var/lib/postgresql/data
    networks: [nutrismart]

  api:
    # Contexto en la raíz del repo: npm workspaces necesita el
    # package-lock.json y los package.json de todos los paquetes.
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: nutrismart-api
    env_file: ../.env
    environment:
      # Solo estas dos cambian dentro de Docker: usan hostnames internos.
      # KEYCLOAK_ISSUER y KEYCLOAK_AUDIENCE NO se tocan aquí — el 'iss' del
      # token siempre es localhost porque lo emite el navegador.
      DATABASE_URL: postgres://nutrismart:changeme@db:5432/nutrismart
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/nutrismart/protocol/openid-connect/certs
      # Lado interno del mapeo 4001:4000. En el .env vale 4001 (dev en el
      # host); aquí debe ser 4000 o el puerto publicado apuntaría a nada.
      API_PORT: "4000"
      # El .env de la raíz es de DESARROLLO y trae NODE_ENV=development,
      # que pisaría el ENV de la imagen. Dentro del contenedor corre el
      # build de producción, sin devDependencies.
      NODE_ENV: production
      # Ruta DENTRO del contenedor; el volumen de abajo la respalda.
      ARCHIVOS_DIR: /datos/archivos
    volumes:
      # Sin este volumen, los informes de laboratorio desaparecerían al
      # recrear el contenedor. Son documentos clínicos.
      - nutrismart_archivos:/datos/archivos
    depends_on: [db]
    ports:
      - "4001:4000"   # 4000 lo ocupa vetplatform-backend-1
    networks: [nutrismart, shared]

  web-professional:
    build:
      context: ..
      dockerfile: apps/web-professional/Dockerfile
      # Estas variables se INCRUSTAN en el bundle durante el build; no
      # son configuración de runtime. Son URLs que resuelve el NAVEGADOR,
      # así que van con localhost, no con hostnames internos de Docker.
      args:
        VITE_API_URL: http://localhost:4001
        VITE_KEYCLOAK_URL: http://localhost:8080
        VITE_KEYCLOAK_REALM: nutrismart
        VITE_KEYCLOAK_CLIENT_ID: nutrismart-web
    container_name: nutrismart-web-pro
    depends_on: [api]
    ports:
      - "5173:80"   # nginx sirve en el 80 dentro del contenedor
    networks: [nutrismart]

  # --- App del paciente (PWA) — se activa en la rebanada del paciente ---
  # Comentada: aún no existe apps/web-patient/Dockerfile y el build rompería
  # 'docker compose up'. Al reactivar, el 5174 del host lo ocupa vetplatform-frontend-1.
  # web-patient:
  #   build: ../apps/web-patient
  #   container_name: nutrismart-web-pat
  #   ports:
  #     - "5174:5173"
  #   networks: [nutrismart]

networks:
  nutrismart:
  shared:
    external: true
    name: ${KEYCLOAK_NETWORK:-postgres_default}

volumes:
  nutrismart_pgdata:
  nutrismart_archivos:
