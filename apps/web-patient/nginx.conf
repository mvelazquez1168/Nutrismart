server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fallback de SPA.
  #
  # Aquí importa más que en la app profesional: el enlace de invitación
  # llega por correo a /activar?token=… y Keycloak devuelve al paciente a
  # esa misma ruta profunda. Sin este fallback, el enlace del correo daría
  # 404 y la invitación sería inservible.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los bundles llevan hash en el nombre, así que se pueden cachear para
  # siempre. index.html NO: es quien apunta al hash nuevo tras un deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
