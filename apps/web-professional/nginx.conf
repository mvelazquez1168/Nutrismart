server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Fallback de SPA.
  #
  # Sin esta línea, recargar /pacientes/abc-123 daría 404: nginx buscaría
  # un archivo con esa ruta y no existe — solo existe index.html, y es
  # React Router quien resuelve la ruta ya en el navegador. Lo mismo pasa
  # al volver del login de Keycloak, que redirige a una URL profunda.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los bundles llevan hash en el nombre, así que se pueden cachear para
  # siempre. index.html NO: es quien apunta al hash nuevo tras un deploy.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
