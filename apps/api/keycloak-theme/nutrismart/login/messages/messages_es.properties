# Textos en espanol del login de NutriSmart — R54.
#
# Keycloak trae su propio paquete en espanol, pero solo lo usa si el
# realm tiene la internacionalizacion ACTIVADA y el espanol entre los
# idiomas. Sin eso cae al ingles, y la pantalla sale con «Sign In» y
# «Password» dentro de una aplicacion que esta entera en espanol.
#
# Este fichero hace dos cosas: asegurar el espanol aunque el paquete
# base cambie, y ajustar el tono al de la aplicacion. Keycloak lee los
# .properties en ISO-8859-1 salvo que se escapen los caracteres, asi que
# los acentos van como \uXXXX. Es feo y es lo que entiende.

# \u00bfCu\u00e1l es tu usuario? Los profesionales entran con su correo,
# los pacientes pueden tener un usuario que no lo es.
usernameOrEmail=Usuario o correo
password=Contrase\u00f1a
doLogIn=Entrar
doForgotPassword=\u00bfOlvidaste tu contrase\u00f1a?

# Mensajes de error. El de credenciales no dice CUAL de los dos campos
# fallo, y es deliberado de Keycloak: decirlo permite averiguar que
# usuarios existen.
invalidUserMessage=Usuario o contrase\u00f1a incorrectos.
accountDisabledMessage=Esta cuenta est\u00e1 desactivada. Habla con el administrador de tu cl\u00ednica.
accountTemporarilyDisabledMessage=Demasiados intentos. Prueba otra vez en unos minutos.
expiredCodeMessage=La sesi\u00f3n de acceso caduc\u00f3. Vuelve a entrar.

# Recuperacion de contrase\u00f1a.
emailForgotTitle=Recuperar tu contrase\u00f1a
emailInstruction=Escribe tu usuario o tu correo y te enviamos un enlace para cambiarla.
doSubmit=Enviar
# Propia del tema, solo para la pantalla de recuperacion. El boton NO
# reusa doSubmit: esa clave es generica de Keycloak y la usan otros
# formularios, que no envian ninguna instruccion.
nsEnviarInstrucciones=Enviar instrucciones
# El guillemet abre el texto como una flecha de vuelta. Va en el
# mensaje y no en la plantilla para que viaje con la traduccion.
backToLogin=\u00ab Volver al login
