# Tema de login de NutriSmart — R54.
#
# OJO con la ubicacion: este archivo va en <tema>/login/, no en la raiz
# del tema. Keycloak busca las propiedades DENTRO de la carpeta del tipo
# de tema (login, account, email...). Puesto un nivel mas arriba se
# ignora en silencio: el tema aparece en la lista del admin, se puede
# seleccionar, y el login sigue saliendo con el aspecto de siempre.
parent=keycloak
import=common/keycloak

styles=css/login.css
